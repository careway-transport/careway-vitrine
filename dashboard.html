<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mon espace | CareWay</title>
<link rel="icon" type="image/png" href="./photos/logo_CW_officiel.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
<style>
/* ── TOKENS ───────────────────────────────────────────── */
:root{
  --sb:#0B1F3A; --bg:#F0F4FA; --card:#fff;
  --text:#0B1F3A; --muted:#6B7A90; --border:#DDE5F0;
  --green:#16A34A; --green-l:#DCFCE7;
  --amber:#B45309; --amber-l:#FEF3C7;
  --red:#DC2626;   --red-l:#FEE2E2;
  --shadow:0 1px 4px rgba(11,31,58,.08);
  --shad-m:0 4px 20px rgba(11,31,58,.12);
  --r:12px; --sidebar:252px;
  /* accent = per-profile */
  --accent:#0072E5; --accent-l:#EBF3FF; --accent-d:#0057B8; --accent-t:rgba(0,114,229,.10);
}
.p-patient     {--accent:#0072E5;--accent-l:#EBF3FF;--accent-d:#0057B8;--accent-t:rgba(0,114,229,.10);--grad:linear-gradient(135deg,#0057B8 0%,#0ea5e9 100%)}
.p-aidant      {--accent:#7C3AED;--accent-l:#F5F3FF;--accent-d:#5B21B6;--accent-t:rgba(124,58,237,.10);--grad:linear-gradient(135deg,#5B21B6 0%,#a78bfa 100%)}
.p-prescripteur{--accent:#00B4A6;--accent-l:#E6F9F8;--accent-d:#008F84;--accent-t:rgba(0,180,166,.10);--grad:linear-gradient(135deg,#008F84 0%,#2dd4bf 100%)}
.p-transporteur{--accent:#EA580C;--accent-l:#FFF7ED;--accent-d:#C2410C;--accent-t:rgba(234,88,12,.10);--grad:linear-gradient(135deg,#C2410C 0%,#fb923c 100%)}
.p-coordinateur{--accent:#059669;--accent-l:#ECFDF5;--accent-d:#047857;--accent-t:rgba(5,150,105,.10);--grad:linear-gradient(135deg,#047857 0%,#34d399 100%)}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Inter',sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit} img{display:block;max-width:100%} button{cursor:pointer;font-family:inherit;border:none}

/* ── LAYOUT ──────────────────────────────────────────── */
.layout{display:flex;min-height:100vh}

/* ── SIDEBAR ─────────────────────────────────────────── */
.sidebar{width:var(--sidebar);min-height:100vh;background:var(--sb);display:flex;flex-direction:column;position:fixed;top:0;left:0;z-index:200;transition:transform .28s}
.sb-logo{display:flex;align-items:center;gap:10px;padding:22px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
.sb-logo img{width:32px;height:32px;object-fit:contain}
.sb-logo-txt{font-family:'Sora',sans-serif;font-size:1.1rem;font-weight:700;color:#fff}
.sb-logo-txt b{color:var(--accent)}
.sb-section{font-size:.6rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.3);padding:16px 18px 5px}
.sb-nav{flex:1;padding:10px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:9px;font-size:.88rem;font-weight:500;color:rgba(255,255,255,.5);transition:all .18s;cursor:pointer;position:relative;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:var(--accent-t);color:#fff}
.nav-item.active::before{content:'';position:absolute;left:0;top:25%;bottom:25%;width:3px;background:var(--accent);border-radius:0 3px 3px 0}
.nav-item i{font-size:.95rem;width:18px;text-align:center;flex-shrink:0}
.nav-badge{margin-left:auto;background:var(--accent);color:#fff;font-size:.65rem;font-weight:700;padding:1px 7px;border-radius:20px;min-width:20px;text-align:center}
.sb-user{padding:12px 10px;border-top:1px solid rgba(255,255,255,.08)}
.user-card{display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:9px;background:rgba(255,255,255,.06)}
.user-av{width:34px;height:34px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:.82rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.user-role{font-size:.7rem;color:var(--accent);margin-top:1px}
.btn-logout{background:none;color:rgba(255,255,255,.35);padding:4px;border-radius:5px;font-size:1rem;transition:color .18s;flex-shrink:0}
.btn-logout:hover{color:#f87171}

/* ── TOPBAR ──────────────────────────────────────────── */
.main{margin-left:var(--sidebar);flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{background:#fff;border-bottom:1px solid var(--border);padding:0 24px;height:58px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:var(--shadow)}
.topbar-l{display:flex;align-items:center;gap:10px}
.topbar-l h1{font-family:'Sora',sans-serif;font-size:.98rem;font-weight:600}
.topbar-r{display:flex;align-items:center;gap:8px}
.demo-pill{background:#FEF3C7;border:1px solid #FDE68A;color:#92400E;font-size:.65rem;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.05em}
.ppill{padding:4px 13px;border-radius:20px;font-size:.78rem;font-weight:600;background:var(--accent-l);color:var(--accent-d)}
.icon-btn{background:rgba(11,31,58,.05);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;position:relative;transition:all .18s}
.icon-btn:hover{background:var(--accent-l);border-color:var(--accent);color:var(--accent-d)}
.notif-count{position:absolute;top:-4px;right:-4px;width:16px;height:16px;background:var(--accent);color:#fff;font-size:.6rem;font-weight:700;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.menu-btn{display:none;background:none;border:none;font-size:1.3rem;color:var(--text);padding:4px;border-radius:6px}

/* ── NOTIFICATION PANEL ──────────────────────────────── */
.notif-overlay{display:none;position:fixed;inset:0;z-index:300;background:rgba(11,31,58,.3)}
.notif-overlay.open{display:block}
.notif-panel{position:fixed;top:0;right:-380px;width:360px;height:100vh;background:#fff;box-shadow:-4px 0 32px rgba(11,31,58,.15);z-index:301;display:flex;flex-direction:column;transition:right .3s cubic-bezier(.4,0,.2,1)}
.notif-panel.open{right:0}
.np-head{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 16px;border-bottom:1px solid var(--border)}
.np-title{font-family:'Sora',sans-serif;font-size:1rem;font-weight:700}
.np-close{background:none;color:var(--muted);font-size:1.1rem;padding:4px;border-radius:6px;transition:color .18s}
.np-close:hover{color:var(--text)}
.np-list{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.np-item{display:flex;gap:12px;padding:12px;border-radius:10px;border:1px solid var(--border);background:#F8FAFD;transition:background .18s;cursor:pointer}
.np-item:hover{background:var(--accent-l)}
.np-item.unread{background:var(--accent-l);border-color:var(--accent)}
.np-item.unread::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;margin-top:4px}
.np-icon{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0}
.np-txt{font-size:.82rem;line-height:1.4}
.np-time{font-size:.7rem;color:var(--muted);margin-top:3px}

/* ── PAGE ────────────────────────────────────────────── */
.page{padding:22px 24px 48px;flex:1}

/* ── GREETING ────────────────────────────────────────── */
.greeting{background:var(--grad);border-radius:var(--r);padding:22px 26px;color:#fff;margin-bottom:18px;position:relative;overflow:hidden;display:flex;align-items:center;gap:16px}
.greeting::after{content:'';position:absolute;right:-30px;top:-40px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.greeting::before{content:'';position:absolute;right:80px;bottom:-50px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.05)}
.greeting-ico{font-size:2rem;opacity:.9;flex-shrink:0}
.greeting h2{font-family:'Sora',sans-serif;font-size:1.3rem;font-weight:700;margin-bottom:3px}
.greeting p{font-size:.88rem;opacity:.9}

/* ── CARDS ───────────────────────────────────────────── */
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);box-shadow:var(--shadow);overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.card-title{font-size:.9rem;font-weight:600;display:flex;align-items:center;gap:7px}
.card-title i{color:var(--accent)}
.card-act{font-size:.78rem;color:var(--accent);cursor:pointer;font-weight:600}
.card-body{padding:14px 18px}

/* ── GRIDS ───────────────────────────────────────────── */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g-main{display:grid;grid-template-columns:1fr 340px;gap:18px}
.stack{display:flex;flex-direction:column;gap:14px}

/* ── STAT MINI ───────────────────────────────────────── */
.stat-mini{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-mini::after{content:'';position:absolute;top:0;right:0;width:60px;height:60px;border-radius:0 0 0 60px;background:var(--accent-t)}
.s-ico{width:36px;height:36px;border-radius:9px;background:var(--accent-l);color:var(--accent-d);display:flex;align-items:center;justify-content:center;font-size:1rem;margin-bottom:10px}
.s-val{font-family:'Sora',sans-serif;font-size:1.65rem;font-weight:700;line-height:1}
.s-lbl{font-size:.79rem;color:var(--muted);margin-top:5px}
.s-sub{font-size:.72rem;color:var(--green);margin-top:3px;display:flex;align-items:center;gap:3px}
.s-sub.warn{color:var(--amber)}

/* ── BADGES ──────────────────────────────────────────── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:.72rem;font-weight:600}
.b-green{background:var(--green-l);color:var(--green)}
.b-amber{background:var(--amber-l);color:var(--amber)}
.b-red{background:var(--red-l);color:var(--red)}
.b-blue{background:#EBF3FF;color:#0057B8}
.b-teal{background:#E6F9F8;color:#008F84}
.b-purple{background:#F5F3FF;color:#5B21B6}
.b-gray{background:#F1F5F9;color:#64748B}
.b-accent{background:var(--accent-l);color:var(--accent-d)}
.b-orange{background:#FFF7ED;color:#C2410C}

/* ── BUTTONS ─────────────────────────────────────────── */
.btn-p{background:var(--accent);color:#fff;border-radius:8px;padding:9px 18px;font-size:.86rem;font-weight:600;transition:background .18s}
.btn-p:hover{background:var(--accent-d)}
.btn-s{background:var(--accent-l);color:var(--accent-d);border-radius:8px;padding:9px 18px;font-size:.86rem;font-weight:600;transition:background .18s}
.btn-s:hover{background:var(--accent)}  .btn-s:hover{color:#fff}
.cta-sm{background:var(--accent-l);border:1px solid rgba(0,0,0,.06);color:var(--accent-d);border-radius:7px;padding:5px 12px;font-size:.76rem;font-weight:600;transition:all .18s}
.cta-sm:hover{background:var(--accent);color:#fff}

/* ── LIST ITEMS ──────────────────────────────────────── */
.list-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.list-item:last-child{border-bottom:none;padding-bottom:0}
.list-item:first-child{padding-top:0}
.li-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.05rem;flex-shrink:0}
.li-d{flex:1}
.li-t{font-size:.9rem;font-weight:600;margin-bottom:2px}
.li-s{font-size:.78rem;color:var(--muted)}
.li-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:5px}
.mc{display:inline-flex;align-items:center;gap:3px;font-size:.74rem;color:var(--muted)}

/* ── COUNTDOWN ───────────────────────────────────────── */
.countdown-card{background:var(--accent-l);border:1px solid var(--accent);border-radius:var(--r);padding:20px;text-align:center;margin-bottom:18px}
.cd-lbl{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--accent-d);margin-bottom:12px}
.cd-display{display:flex;align-items:center;justify-content:center;gap:8px}
.cd-unit{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:9px;padding:10px 14px;box-shadow:var(--shadow);min-width:60px}
.cd-n{font-family:'Sora',sans-serif;font-size:1.6rem;font-weight:800;color:var(--accent-d);line-height:1}
.cd-l{font-size:.65rem;color:var(--muted);margin-top:3px}
.cd-sep{font-size:1.4rem;font-weight:700;color:var(--accent-d);margin-bottom:10px}

/* ── ROUTE TRACKER ───────────────────────────────────── */
.route-track{display:flex;align-items:center;gap:10px;margin:14px 0}
.rt-pt{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0}
.rt-dot{width:14px;height:14px;border-radius:50%;background:var(--accent);border:3px solid var(--accent-l);box-shadow:0 0 0 3px var(--accent-t)}
.rt-dot.end{background:var(--green);border-color:var(--green-l);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
.rt-lbl{font-size:.7rem;color:var(--muted);text-align:center;max-width:70px}
.rt-line{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden;position:relative}
.rt-fill{height:100%;background:var(--accent);border-radius:2px;transition:width 1s ease}

/* ── CHECKLIST ───────────────────────────────────────── */
.checklist{display:flex;flex-direction:column;gap:8px}
.cl-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;border:1px solid var(--border);cursor:pointer;transition:all .18s;background:#F8FAFD}
.cl-item:hover{border-color:var(--accent);background:var(--accent-l)}
.cl-item.done{background:var(--green-l);border-color:rgba(22,163,74,.3)}
.cl-check{width:20px;height:20px;border-radius:5px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s;background:#fff;color:transparent;font-size:.75rem}
.cl-item.done .cl-check{background:var(--green);border-color:var(--green);color:#fff}
.cl-txt{font-size:.84rem;font-weight:500;flex:1}
.cl-item.done .cl-txt{color:var(--muted);text-decoration:line-through}

/* ── DOC CARD ────────────────────────────────────────── */
.doc-card{display:flex;align-items:center;gap:11px;padding:11px 14px;background:#F8FAFD;border:1px solid var(--border);border-radius:9px;cursor:pointer;transition:all .18s}
.doc-card:hover{background:var(--accent-l);border-color:var(--accent)}
.doc-ico{width:36px;height:36px;border-radius:8px;background:var(--accent-l);color:var(--accent-d);display:flex;align-items:center;justify-content:center;font-size:.95rem;flex-shrink:0}
.doc-name{font-size:.83rem;font-weight:600}
.doc-date{font-size:.71rem;color:var(--muted);margin-top:1px}

/* ── PAT CARD ────────────────────────────────────────── */
.pat-card{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:#fff;transition:box-shadow .18s}
.pat-card:hover{box-shadow:var(--shad-m)}
.pat-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.84rem;font-weight:700;flex-shrink:0}
.pat-name{font-size:.88rem;font-weight:600}
.pat-info{font-size:.75rem;color:var(--muted);margin-top:1px}
.health-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hd-ok{background:var(--green)}
.hd-warn{background:var(--amber)}
.hd-alert{background:var(--red)}

/* ── MISSION CARD ────────────────────────────────────── */
.m-card{display:flex;gap:12px;align-items:stretch;padding:12px 14px;border:1px solid var(--border);border-radius:9px;background:#fff;transition:box-shadow .18s}
.m-card:hover{box-shadow:var(--shad-m)}
.m-card.active{border-color:var(--accent);background:var(--accent-t)}
.m-time-col{text-align:center;flex-shrink:0;width:46px;padding-top:2px}
.m-hr{font-family:'Sora',sans-serif;font-size:1rem;font-weight:700;color:var(--accent-d)}
.m-mn{font-size:.68rem;color:var(--muted)}
.m-sep{width:1px;background:var(--border);flex-shrink:0}
.m-body{flex:1}
.m-route{font-size:.88rem;font-weight:600;margin-bottom:2px}
.m-pat{font-size:.77rem;color:var(--muted);margin-bottom:5px}
.m-type{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.69rem;font-weight:600}
.t-vsl{background:#EEF2FF;color:#4338CA}
.t-tap{background:#F5F3FF;color:#7C3AED}
.t-ambu{background:#FFF7ED;color:#C2410C}

/* ── LIVE MISSION ────────────────────────────────────── */
.live-mission{border:2px solid var(--accent);background:var(--accent-t);border-radius:var(--r);padding:18px;margin-bottom:16px}
.live-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.live-dot{width:10px;height:10px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;flex-shrink:0}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.5)}70%{box-shadow:0 0 0 8px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.live-badge{font-size:.7rem;font-weight:700;color:var(--green);letter-spacing:.06em;text-transform:uppercase}
.live-route{font-family:'Sora',sans-serif;font-size:1.05rem;font-weight:700;margin-bottom:4px}
.live-pat{font-size:.82rem;color:var(--muted);margin-bottom:14px}
.route-prog{position:relative}
.rp-bar{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:6px}
.rp-fill{height:100%;background:linear-gradient(90deg,var(--accent-d),var(--accent));border-radius:3px;transition:width 2s ease}
.rp-labels{display:flex;justify-content:space-between;font-size:.7rem;color:var(--muted)}
.live-eta{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--accent-d);margin-top:10px}

/* ── DONUT ───────────────────────────────────────────── */
.donut-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.donut-wrap{text-align:center}
.donut-ring{width:80px;height:80px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;margin:0 auto 8px}
.donut-ring svg{position:absolute;top:0;left:0;transform:rotate(-90deg)}
.donut-val{font-family:'Sora',sans-serif;font-size:1rem;font-weight:800;color:var(--text)}
.donut-lbl{font-size:.74rem;color:var(--muted);font-weight:500}

/* ── PROGRESS ────────────────────────────────────────── */
.prog-wrap{margin:8px 0}
.prog-lbl{display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:5px}
.prog-bar{height:6px;background:#E2E8F0;border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent-d),var(--accent))}

/* ── MSG ─────────────────────────────────────────────── */
.msg-bub{padding:13px 15px;border-radius:10px;border:1px solid var(--border);background:#F8FAFD}
.msg-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.msg-txt{font-size:.84rem;line-height:1.55;color:var(--text)}
.msg-input{width:100%;border:1px solid var(--border);border-radius:9px;padding:10px 14px;font-size:.84rem;color:var(--text);font-family:'Inter',sans-serif;resize:none;height:72px;margin-top:12px}
.msg-input:focus{outline:none;border-color:var(--accent)}

/* ── TABS ────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;background:#F1F5F9;border-radius:9px;padding:4px;margin-bottom:14px}
.tab{flex:1;text-align:center;padding:7px;border-radius:7px;font-size:.8rem;font-weight:500;color:var(--muted);cursor:pointer;transition:all .18s}
.tab.active{background:#fff;color:var(--accent-d);font-weight:600;box-shadow:var(--shadow)}

/* ── ALERT BAR ───────────────────────────────────────── */

<script>
/* ── AUTH ──────────────────────────────────────────────── */
const raw = localStorage.getItem('cw_user');

function g(id) { return document.getElementById(id); }
function initials(n) { return n.split(' ').filter(Boolean).map(w=>w[0]).join('').substring(0,2).toUpperCase(); }

/* ── QR CODE (SVG généré en pur JS, pas de lib externe) ── */
function qrSVG(data, size=160) {
  /* QR simplifié visuel — motif aléatoire stable basé sur le hash de `data` */
  let h = 0; for (let c of data) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0;
  function bit(i) { return ((h ^ (h >>> (i%8)) ^ (i*1234567)) & 1) === 0; }
  const M = 21, cell = Math.floor(size / M), total = cell * M;
  let svg = `<svg width="${total}" height="${total}" viewBox="0 0 ${total} ${total}" xmlns="http://www.w3.org/2000/svg" style="display:block">`;
  svg += `<rect width="${total}" height="${total}" fill="#fff"/>`;
  for (let r = 0; r < M; r++) {
    for (let c2 = 0; c2 < M; c2++) {
      const x = c2*cell, y = r*cell;
      /* position patterns (3 coins) */
      const inFP = (r<7&&c2<7) || (r<7&&c2>M-8) || (r>M-8&&c2<7);
      if (inFP) {
        const er=(r<7)?r:(r-(M-7)), ec=(c2<7)?c2:(c2-(M-7));
        const onBorder=er===0||er===6||ec===0||ec===6, inner=er>=2&&er<=4&&ec>=2&&ec<=4;
        if(onBorder||inner) svg+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="#000"/>`;
      } else if (r===7||c2===7||r===M-8||c2===M-8) {
        /* timing */
        if((r+c2)%2===0) svg+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="#000"/>`;
      } else {
        if (bit(r*M+c2)) svg+=`<rect x="${x}" y="${y}" width="${cell}" height="${cell}" fill="#000"/>`;
      }
    }
  }
  svg += '</svg>';
  return svg;
}

function openQR(title, subtitle, data, extra='') {

    </div>
    ${extra}
    <div style="font-size:.74rem;color:#94A3B8;margin-top:8px"><i class="bi bi-shield-lock"></i> Accès sécurisé · Usage unique</div>`;
  g('qr-modal-overlay').classList.add('open');
}
function closeQR(e) { if(e.target===g('qr-modal-overlay')) closeQRBtn(); }
function closeQRBtn() { g('qr-modal-overlay').classList.remove('open'); }

}

}

let notifData = (NOTIFS[profil]||[]).map((n,i)=>({...n,id:i}));

function renderNotifCount() {
  const cnt = notifData.filter(n=>!n.read).length;

function openNotif() {
  const list = g('np-list');
  list.innerHTML = '';

    d.className = 'np-item'+(n.read?'':' unread');

function closeNotif() {

  renderNotifCount();

let currentPage = 'dashboard';
let timers = [];

function clearTimers() { timers.forEach(clearInterval); timers=[]; }

function buildNav() {
  const el = g('sb-nav'); el.innerHTML='';
  (NAV[profil]||[]).forEach(item => {
    const d = document.createElement('div');
    d.className='nav-item'+(item.id===currentPage?' active':'');
    d.innerHTML=`<i class="bi ${item.i}"></i><span>${item.l}</span>${item.b?`<span class="nav-badge">${item.b}</span>`:''}`;

  });
}
function navigate(id) { clearTimers(); currentPage=id; g('page-title').textContent=PAGE_TITLES[id]||''; buildNav(); renderPage(); window.scrollTo(0,0); }

/* ── ROUTER ────────────────────────────────────────────── */
function renderPage() {
  const PAGES = {
    patient:      { dashboard:pDash, transports:pTransports, documents:pDocs, messages:pMsgs },

/* ── ANIMATED COUNTERS ──────────────────────────────────── */
function animateCounters() {
  document.querySelectorAll('[data-count]').forEach(el => {
    const target=+el.dataset.count, suffix=el.dataset.suffix||'';
    let cur=0; const step=target/(800/16);
    const t=setInterval(()=>{ cur=Math.min(cur+step,target); el.textContent=Math.round(cur)+suffix; if(cur>=target)clearInterval(t); },16);
    timers.push(t);
  });
}

/* ── COUNTDOWN ──────────────────────────────────────────── */
function startCountdown(target) {
  function upd() {
    const diff=new Date(target)-new Date();
    if(diff<=0){['cd-d','cd-h','cd-m','cd-s'].forEach(i=>{const e=g(i);if(e)e.textContent='0';});return;}
    const d=Math.floor(diff/86400000),h=Math.floor((diff%86400000)/3600000),m=Math.floor((diff%3600000)/60000),s=Math.floor((diff%60000)/1000);
    if(g('cd-d'))g('cd-d').textContent=d;
    if(g('cd-h'))g('cd-h').textContent=String(h).padStart(2,'0');
    if(g('cd-m'))g('cd-m').textContent=String(m).padStart(2,'0');
    if(g('cd-s'))g('cd-s').textContent=String(s).padStart(2,'0');
  }
  upd(); const t=setInterval(upd,1000); timers.push(t);
}

/* ── LIVE MISSION PROGRESS ──────────────────────────────── */
function startLiveProgress() {
  let pct=52;
  const el=g('live-fill'), etaEl=g('live-eta-txt');
  if(!el)return;
  el.style.width=pct+'%';
  const t=setInterval(()=>{
    pct=Math.min(pct+0.05,100);
    if(el)el.style.width=pct+'%';
    const rem=Math.round((100-pct)/100*25);
    if(etaEl)etaEl.textContent=rem>0?`Arrivée estimée dans ${rem} min`:'Arrivé à destination';
    if(pct>=100)clearInterval(t);
  },2000);
  timers.push(t);
}

const CL_ITEMS=[
  {id:'docs',l:'Mon dossier médical'},
  {id:'ordo',l:'Mon ordonnance / bon de transport'},
  {id:'cb',l:'Ma carte vitale'},
  {id:'tel',l:'Mon téléphone chargé'},
  {id:'conf',l:'Vêtements confortables'},
];
function getChecklist(){return JSON.parse(localStorage.getItem('cw_cl')||'{}');}
function toggleCL(id){const cl=getChecklist();cl[id]=!cl[id];localStorage.setItem('cw_cl',JSON.stringify(cl));renderCL();}
function renderCL(){
  const cl=getChecklist();
  CL_ITEMS.forEach(item=>{
    const el=g('cl-'+item.id); if(!el)return;
    if(cl[item.id]){el.classList.add('done');}else{el.classList.remove('done');}
  });
  const done=CL_ITEMS.filter(i=>cl[i.id]).length;
  const lbl=g('cl-count'); if(lbl)lbl.textContent=`${done}/${CL_ITEMS.length} éléments préparés`;
}
function clHTML(){
  const cl=getChecklist();
  return CL_ITEMS.map(item=>`
    <div class="cl-item${cl[item.id]?' done':''}" id="cl-${item.id}" onclick="toggleCL('${item.id}')">
      <div class="cl-check"><i class="bi bi-check"></i></div>
      <span class="cl-txt">${item.l}</span>
    </div>`).join('');
}

/* ── TABS ───────────────────────────────────────────────── */
function switchTab(group, tab) {
  document.querySelectorAll(`[data-tabgroup="${group}"]`).forEach(el=>el.classList.remove('active'));
  document.querySelectorAll(`[data-tab="${group}-${tab}"]`).forEach(el=>el.style.display='');
  const tabBtn=document.querySelector(`[data-tabgroup="${group}"][data-val="${tab}"]`);
  if(tabBtn)tabBtn.classList.add('active');
  document.querySelectorAll(`[data-tab]`).forEach(el=>{
    if(el.dataset.tab.startsWith(group+'-')&&el.dataset.tab!==group+'-'+tab) el.style.display='none';
  });
}

function svgDonut(pct,color,size=80){
  const r=30,c=50,circ=2*Math.PI*r;
  const dash=pct/100*circ;
  return `<svg viewBox="0 0 100 100" width="${size}" height="${size}" style="transform:rotate(-90deg)">
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#E2E8F0" stroke-width="10"/>
    <circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-dasharray="${dash} ${circ}" stroke-linecap="round"/>
  </svg>`;
}

      ${stats.map(s=>`<div class="stat-mini"><div class="s-ico"><i class="bi ${s.i}"></i></div><div class="s-val" data-count="${s.v}">${s.v}</div><div class="s-lbl">${s.l}</div></div>`).join('')}
    </div>

    <div class="card">
      <div class="card-head"><span class="card-title"><i class="bi bi-people"></i>Tableau des transporteurs</span></div>
      <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
        ${CR_TRANSPORTEURS.map(t=>`<div class="pat-card">
          <div class="pat-av" style="background:${t.cb};color:${t.c}">${t.ini}</div>
          <div style="flex:1;min-width:0">
            <div class="pat-name">${t.n}</div>
            <div class="pat-info">${t.veh}</div>
            <div style="font-size:.74rem;color:var(--muted);margin-top:2px">${t.note}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <span class="badge ${t.sc}" style="margin-bottom:4px;display:inline-flex">${t.st}</span>
            <div style="font-size:.71rem;color:var(--muted)">${t.missions} mission${t.missions>1?'s':''} auj.</div>
          </div>
        </div>`).join('')}
      </div>
    </div>`;
}
